<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12213b"><title>Personal Contact Manager</title>

<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#17243a;--muted:#718096;--line:#e3e9f1;--navy:#12213b;--blue:#2563eb;--green:#13845b;--red:#c33b45;--amber:#b76b13}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,-apple-system,Segoe UI,Arial}button,input,textarea,select{font:inherit}button{cursor:pointer}.wrap{max-width:1050px;margin:auto;padding:14px 12px 85px}.top{display:flex;align-items:center;gap:12px;background:var(--navy);color:white;border-radius:16px;padding:15px;margin-bottom:12px}.logo{width:42px;height:42px;border-radius:12px;background:white;color:var(--navy);display:grid;place-items:center;font-weight:900}.top h1{font-size:17px;margin:0}.top p{font-size:11px;color:#c5d2e4;margin:3px 0 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:12px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:13px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:24px;margin-top:4px}.nav{display:flex;gap:7px;overflow:auto;padding:2px 0 12px}.nav button,.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 12px;font-weight:700;white-space:nowrap}.nav button.active{background:var(--navy);color:white}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn.green{background:var(--green);border-color:var(--green);color:white}.btn.danger{color:var(--red)}.btn.small{padding:7px 9px;font-size:12px}.panel{margin-bottom:12px}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.head h2{font-size:16px;margin:0}.muted{color:var(--muted)}.tools,.actions{display:flex;gap:7px;flex-wrap:wrap}.field{display:grid;gap:5px;margin:10px 0}.field label{font-size:12px;font-weight:750;color:#526176}.field input,.field textarea,.field select,.search{width:100%;border:1px solid #d7e0eb;border-radius:10px;padding:11px;background:#fff;color:var(--ink)}.field textarea{min-height:75px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.list{display:grid;gap:9px}.person{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.personrow{display:flex;justify-content:space-between;gap:10px}.person h3{font-size:14px;margin:0 0 4px}.phone,.sub{font-size:12px;color:var(--muted)}.notes{font-size:12px;color:#536278;margin-top:7px;white-space:pre-wrap}.tag{font-size:10px;font-weight:800;border-radius:99px;padding:4px 8px;background:#edf3ff;color:#2757a6;height:max-content}.tag.warn{background:#fff4e5;color:#9b5b0a}.tag.good{background:#e8f7ef;color:#13734e}.actions{margin-top:10px}.iconbtn{display:inline-flex;text-decoration:none;background:#eaf2ff;color:#1e5bb7;border-radius:9px;padding:8px 10px;font-weight:800}.empty{text-align:center;padding:25px;color:var(--muted);font-size:13px}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#0d172b99;z-index:10;display:none;align-items:flex-end;justify-content:center;padding:10px}.modal.show{display:flex}.modalbox{background:white;border-radius:17px;padding:16px;width:min(560px,100%);max-height:92vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{font-size:17px;margin:0}.close{border:0;background:#eef2f7;border-radius:9px;padding:8px}.notice{padding:11px 12px;border-radius:10px;background:#eff6ff;color:#24559c;font-size:12px;margin-top:10px;line-height:1.5}.notice.error{background:#fff0f0;color:#a52d36}.loading{max-width:480px;margin:18vh auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px}.loading h2{margin:0 0 5px}.footer{position:fixed;bottom:0;left:0;right:0;text-align:center;padding:9px;background:#ffffffed;border-top:1px solid var(--line);font-size:10px;color:var(--muted)}.datebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}.datebar input{padding:8px;border:1px solid var(--line);border-radius:9px}
@media(max-width:650px){.wrap{padding:10px 9px 80px}.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.top{padding:12px}.stat strong{font-size:22px}}
</style></head><body>
<div id="loadingView" class="loading"><h2 id="loadTitle">Opening your workspace…</h2><p class="muted">Personal Contact Manager</p><div id="loadMessage" class="notice">Starting connection…</div></div>
<div id="app" class="wrap hidden">
<header class="top"><div class="logo">PC</div><div><h1>Personal Contact Manager</h1><p>Contacts · References · Follow-ups</p></div></header>
<section class="stats"><div class="stat"><small>Total contacts</small><strong id="sContacts">0</strong></div><div class="stat"><small>References</small><strong id="sRefs">0</strong></div><div class="stat"><small>Calls logged</small><strong id="sCalls">0</strong></div><div class="stat"><small>Pending reminders</small><strong id="sReminders">0</strong></div></section>
<nav class="nav"><button class="active" data-tab="dashboard">Overview</button><button data-tab="contacts">Contacts</button><button data-tab="reminders">Reminders <span id="bellCount">0</span></button><button data-tab="history">Call history</button></nav><main id="view"></main></div>
<div class="footer">Personal Contact Manager · Private workspace</div>
<div id="modal" class="modal"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle">Add contact</h2><button class="close" id="modalClose">✕</button></div><div id="modalBody"></div></div></div>
<script>
(function(){
'use strict';
const SUPABASE_URL='https://sqgymglyshbyqhlnmxlj.supabase.co';
const SUPABASE_KEY='sb_publishable_55cb_Smd0gZ2l5O_qlTy9w__Y26o1ea';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmt=s=>s?new Date(s).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}):'';
const timeout=(promise,ms,label)=>Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error(label+' timed out after '+Math.round(ms/1000)+' seconds.')),ms))]);
let client,db,user=null,contacts=[],calls=[],reminders=[],tab='dashboard',reminderDate=today();
function loading(message,error=false){$('loadMessage').textContent=message;$('loadMessage').classList.toggle('error',error)}
function fail(error){$('loadTitle').textContent='Could not open workspace';loading((error&&error.message?error.message:String(error))+' Please check your internet connection and refresh. If this continues, send this message to support.',true)}
function loadSupabaseLibrary(){
 return new Promise((resolve,reject)=>{
  if(window.supabase&&window.supabase.createClient)return resolve();
  const script=document.createElement('script');
  script.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
  script.async=true;
  const timer=setTimeout(()=>{script.remove();reject(new Error('Supabase library download timed out. Check your connection or try again.'))},12000);
  script.onload=()=>{clearTimeout(timer);if(window.supabase&&window.supabase.createClient)resolve();else reject(new Error('Supabase library loaded but its client was unavailable.'))};
  script.onerror=()=>{clearTimeout(timer);reject(new Error('Could not download the Supabase library from the CDN.'))};
  document.head.appendChild(script);
 });
}
async function start(){
 try{
  loading('Loading secure database connection…');
  await loadSupabaseLibrary();
  loading('Connecting to Supabase…');
  client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
  db=client.schema('personal_contacts');
  loading('Checking this browser’s secure session…');
  const sessionResult=await timeout(client.auth.getSession(),12000,'Checking saved session');
  if(sessionResult.error)throw sessionResult.error;
  let session=sessionResult.data.session;
  if(!session){
   loading('Creating your private workspace identity…');
   const signResult=await timeout(client.auth.signInAnonymously(),15000,'Anonymous sign-in');
   if(signResult.error)throw signResult.error;
   session=signResult.data.session;
  }
  if(!session||!session.user)throw new Error('Supabase did not return a signed-in session. Confirm anonymous sign-ins are enabled and saved.');
  user=session.user;
  loading('Connected. Loading your contacts and reminders…');
  await timeout(loadAll(),18000,'Loading contact data');
  $('loadingView').classList.add('hidden');$('app').classList.remove('hidden');
 }catch(e){console.error('PCM startup error:',e);fail(e)}
}
async function loadAll(){
 const results=await Promise.all([
  db.from('contacts').select('*').order('created_at',{ascending:false}),
  db.from('call_logs').select('*').order('called_at',{ascending:false}),
  db.from('reminders').select('*').order('remind_at')
 ]);
 for(const r of results)if(r.error)throw new Error('Database: '+r.error.message);
 contacts=results[0].data||[];calls=results[1].data||[];reminders=results[2].data||[];
 render();
}
function contact(id){return contacts.find(c=>c.id===id)}
function mainContacts(){return contacts.filter(c=>c.contact_type==='main')}
function stats(){
 $('sContacts').textContent=mainContacts().length;
 $('sRefs').textContent=contacts.filter(c=>c.contact_type==='reference').length;
 $('sCalls').textContent=calls.length;
 const pending=reminders.filter(r=>r.status==='pending');
 $('sReminders').textContent=pending.length;
 $('bellCount').textContent=pending.filter(r=>r.remind_at.slice(0,10)<=today()).length;
}
function whatsappUrl(phone){
 let n=String(phone||'').replace(/\\D/g,'');
 if(n.startsWith('0'))n=n.slice(1);
 if(n.length===10)n='91'+n;
 return 'https://wa.me/'+n;
}
function referenceTree(parentId,depth=0,visited=new Set()){
 const children=contacts.filter(r=>r.contact_type==='reference'&&r.referred_by_contact_id===parentId&&!visited.has(r.id));
 if(!children.length)return '';
 const boxId='refs-'+parentId;
 return '<div style="margin-top:10px"><button class="btn small" onclick="PCM.toggleRefs(&quot;'+boxId+'&quot;)">＋ Show '+children.length+' contact'+(children.length===1?'':'s')+'</button><div id="'+boxId+'" class="hidden" style="margin-top:10px;padding-left:'+Math.min(depth*10,30)+'px;border-left:2px solid #dce6f4"><div class="list">'+children.map(r=>{
  const next=new Set(visited);next.add(r.id);
  return '<article class="person" style="background:#f8fafc"><div class="personrow"><div><b>'+esc(r.name)+'</b><div class="phone">'+esc(r.phone)+'</div></div><span class="tag">Contact</span></div>'+(r.notes?'<div class="notes">'+esc(r.notes)+'</div>':'')+
  '<div class="actions"><a class="iconbtn" href="tel:'+encodeURIComponent(r.phone)+'">☎ Call</a><a class="iconbtn" href="'+whatsappUrl(r.phone)+'" target="_blank" rel="noopener">◉ WhatsApp</a><button class="btn small" onclick="PCM.logCall(&quot;'+r.id+'&quot;)">＋ Log call</button><button class="btn small" onclick="PCM.newReminder(&quot;'+r.id+'&quot;)">＋ Reminder</button><button class="btn small" onclick="PCM.newReference(&quot;'+r.id+'&quot;)">＋ Add contact</button><button class="btn small" onclick="PCM.editContact(&quot;'+r.id+'&quot;)">Edit</button></div>'+
  referenceTree(r.id,depth+1,next)+'</article>';
 }).join('')+'</div></div></div>';
}
function card(c){
 const linked=contacts.filter(r=>r.contact_type==='reference'&&r.referred_by_contact_id===c.id);
 return '<article class="person"><div class="personrow"><div><h3>'+esc(c.name)+'</h3><div class="phone">'+esc(c.phone)+'</div></div><span class="tag">Main contact</span></div>'+
 (c.notes?'<div class="notes">'+esc(c.notes)+'</div>':'')+
 '<div class="actions"><a class="iconbtn" href="tel:'+encodeURIComponent(c.phone)+'">☎ Call</a><a class="iconbtn" href="'+whatsappUrl(c.phone)+'" target="_blank" rel="noopener">◉ WhatsApp</a><button class="btn small" onclick="PCM.logCall(&quot;'+c.id+'&quot;)">＋ Log call</button><button class="btn small" onclick="PCM.newReminder(&quot;'+c.id+'&quot;)">＋ Reminder</button><button class="btn small" onclick="PCM.newReference(&quot;'+c.id+'&quot;)">＋ Add contact</button><button class="btn small" onclick="PCM.editContact(&quot;'+c.id+'&quot;)">Edit</button></div>'+
 (linked.length?referenceTree(c.id,0,new Set([c.id])):'<div class="sub" style="margin-top:10px">No additional contacts linked yet.</div>')+
 '</article>';
}
function reminderCard(r){
 const p=contact(r.contact_id);
 return '<article class="person"><div class="personrow"><div><h3>'+esc(r.title)+'</h3><div class="sub" style="color:var(--amber);font-weight:750">'+fmt(r.remind_at)+'</div>'+(p?'<div class="phone">Contact: '+esc(p.name)+' · '+esc(p.phone)+'</div>':'')+'</div><span class="tag '+(r.status==='pending'?'warn':'good')+'">'+esc(r.status)+'</span></div>'+(r.notes?'<div class="notes">'+esc(r.notes)+'</div>':'')+(r.status==='pending'?'<div class="actions"><button class="btn small green" onclick="PCM.completeReminder(\''+r.id+'\')">✓ Complete</button><button class="btn small danger" onclick="PCM.cancelReminder(\''+r.id+'\')">Cancel</button>'+(p?'<a class="iconbtn" href="tel:'+encodeURIComponent(p.phone)+'">☎ Call</a>':'')+'</div>':'')+'</article>';
}
function setTab(t){tab=t;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
function render(){
 if(!user)return;stats();const v=$('view');
 if(tab==='dashboard'){
  const due=reminders.filter(r=>r.status==='pending'&&r.remind_at.slice(0,10)<=today());
  v.innerHTML='<section class="panel"><div class="head"><h2>Good day</h2><span class="muted">'+new Date().toLocaleDateString('en-IN',{dateStyle:'full'})+'</span></div><div class="tools"><button class="btn primary" onclick="PCM.newContact()">＋ Add contact</button></div><h3>Due and overdue reminders</h3>'+(due.length?'<div class="list">'+due.map(reminderCard).join('')+'</div>':'<div class="empty">No reminders due today.</div>')+'</section><section class="panel"><div class="head"><h2>Recently added contacts</h2><button class="btn small" onclick="PCM.setTab(\'contacts\')">View all</button></div><div class="list">'+(mainContacts().slice(0,5).map(card).join('')||'<div class="empty">No contacts added yet.</div>')+'</div></section>';
 }else if(tab==='contacts'){
  const arr=mainContacts();
  v.innerHTML='<section class="panel"><div class="head"><h2>Contacts</h2><button class="btn primary" onclick="PCM.newContact()">＋ Add contact</button></div><input class="search" id="search" placeholder="Search name or phone number…"><div id="contactList" class="list" style="margin-top:12px">'+(arr.map(card).join('')||'<div class="empty">Nothing here yet.</div>')+'</div></section>';
  $('search').addEventListener('input',()=>{const q=$('search').value.toLowerCase();$('contactList').innerHTML=arr.filter(c=>(c.name+' '+c.phone+' '+contacts.filter(r=>r.referred_by_contact_id===c.id).map(r=>r.name+' '+r.phone).join(' ')).toLowerCase().includes(q)).map(card).join('')||'<div class="empty">No matches.</div>'});
 }else if(tab==='reminders'){
  const list=reminders.filter(r=>r.remind_at.slice(0,10)===reminderDate);
  v.innerHTML='<section class="panel"><div class="head"><h2>Reminder Centre</h2><button class="btn primary" onclick="PCM.newReminder()">＋ Add reminder</button></div><div class="datebar"><label for="rDate">Select date</label><input id="rDate" type="date" value="'+reminderDate+'"><button class="btn small" onclick="PCM.todayReminders()">Today</button></div><div class="list">'+(list.map(reminderCard).join('')||'<div class="empty">No reminders for this date.</div>')+'</div><p class="muted" style="font-size:11px">Pending reminders remain visible until completed or cancelled.</p></section>';
  $('rDate').addEventListener('change',e=>{reminderDate=e.target.value;render()});
 }else if(tab==='history'){
  v.innerHTML='<section class="panel"><div class="head"><h2>Call history</h2></div><div class="list">'+(calls.map(c=>{const p=contact(c.contact_id);return '<article class="person"><div class="personrow"><div><h3>'+esc(p?.name||'Deleted contact')+'</h3><div class="phone">'+fmt(c.called_at)+' · '+esc(c.outcome)+'</div></div><span class="tag">'+esc(c.outcome)+'</span></div>'+(c.notes?'<div class="notes">'+esc(c.notes)+'</div>':'')+'</article>'}).join('')||'<div class="empty">No calls logged yet.</div>')+'</div></section>';
 }
}
function openModal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show')}
$('modalClose').onclick=closeModal;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};
function newContact(id=null){
 const c=id?contact(id):null;
 openModal(c?'Edit contact':'Add contact','<form id="contactForm"><div class="field"><label>Name *</label><input name="name" required value="'+esc(c?.name||'')+'"></div><div class="field"><label>Phone number *</label><input name="phone" type="tel" required value="'+esc(c?.phone||'')+'"></div><div class="field"><label>Notes</label><textarea name="notes">'+esc(c?.notes||'')+'</textarea></div>'+
 '<div class="person" style="background:#f8fafc"><label style="display:flex;gap:9px;align-items:center;font-weight:800"><input id="addRefToggle" type="checkbox" style="width:18px;height:18px"> Add a reference for this contact</label><div id="inlineReferenceFields" class="hidden"><div class="field"><label>Reference name *</label><input name="refName" placeholder="Enter reference name"></div><div class="field"><label>Reference phone number *</label><input name="refPhone" type="tel" placeholder="Enter phone number"></div><div class="field"><label>Reference notes</label><textarea name="refNotes" placeholder="Optional notes"></textarea></div></div></div>'+
 '<div class="tools" style="margin-top:12px"><button class="btn primary">Save contact</button><button type="button" class="btn" onclick="PCM.closeModal()">Cancel</button></div></form>');
 $('addRefToggle').addEventListener('change',e=>{$('inlineReferenceFields').classList.toggle('hidden',!e.target.checked);$('inlineReferenceFields').querySelector('[name="refName"]').required=e.target.checked;$('inlineReferenceFields').querySelector('[name="refPhone"]').required=e.target.checked});
 $('contactForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const row={owner_id:user.id,name:f.get('name').trim(),phone:f.get('phone').trim(),notes:f.get('notes'),contact_type:'main',referred_by_contact_id:null,updated_at:new Date().toISOString()};const saved=c?await db.from('contacts').update(row).eq('id',c.id).select().single():await db.from('contacts').insert(row).select().single();if(saved.error)return alert(saved.error.message);const parentId=c?c.id:saved.data.id;if($('addRefToggle').checked){const ref=await db.from('contacts').insert({owner_id:user.id,name:f.get('refName').trim(),phone:f.get('refPhone').trim(),notes:f.get('refNotes')||'',contact_type:'reference',referred_by_contact_id:parentId});if(ref.error){closeModal();await loadAll();return alert('Contact saved, but reference could not be saved: '+ref.error.message)}}closeModal();await loadAll()};
}
async function newReference(parentId){
 const parent=contact(parentId);if(!parent)return alert('Contact not found.');
 openModal('Add reference for '+esc(parent.name),'<form id="referenceForm"><div class="notice">This reference will be saved under '+esc(parent.name)+'.</div><div class="field"><label>Reference name *</label><input name="name" required></div><div class="field"><label>Phone number *</label><input name="phone" type="tel" required></div><div class="field"><label>Notes</label><textarea name="notes"></textarea></div><div class="tools"><button class="btn primary">Save reference</button><button type="button" class="btn" onclick="PCM.closeModal()">Cancel</button></div></form>');
 $('referenceForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),r=await db.from('contacts').insert({owner_id:user.id,name:f.get('name').trim(),phone:f.get('phone').trim(),notes:f.get('notes')||'',contact_type:'reference',referred_by_contact_id:parentId});if(r.error)return alert(r.error.message);closeModal();await loadAll()};
}
async function logCall(id){
 const c=contact(id);openModal('Log call · '+esc(c.name),'<form id="callForm"><div class="field"><label>Call outcome</label><select name="outcome"><option value="connected">Connected</option><option value="no_answer">No answer</option><option value="callback">Callback requested</option><option value="not_interested">Not interested</option></select></div><div class="field"><label>Call notes</label><textarea name="notes"></textarea></div><button class="btn primary">Save call log</button></form>');
 $('callForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),r=await db.from('call_logs').insert({owner_id:user.id,contact_id:id,outcome:f.get('outcome'),notes:f.get('notes')});if(r.error)return alert(r.error.message);closeModal();await loadAll()};
}
function newReminder(id=null){
 const c=id?contact(id):null;
 openModal('Create reminder','<form id="remForm"><div class="field"><label>Reminder title *</label><input name="title" required value="'+(c?'Call '+esc(c.name):'')+'" placeholder="e.g. Call back"></div><div class="field"><label>Link to contact</label><select name="contact"><option value="">No linked contact</option>'+contacts.map(p=>'<option value="'+p.id+'" '+(id===p.id?'selected':'')+'>'+esc(p.name)+' · '+esc(p.phone)+'</option>').join('')+'</select></div><div class="grid2"><div class="field"><label>Date *</label><input name="date" type="date" required value="'+reminderDate+'"></div><div class="field"><label>Time *</label><input name="time" type="time" required value="10:00"></div></div><div class="field"><label>Notes</label><textarea name="notes"></textarea></div><button class="btn primary">Save reminder</button></form>');
 $('remForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),r=await db.from('reminders').insert({owner_id:user.id,contact_id:f.get('contact')||null,title:f.get('title'),notes:f.get('notes'),remind_at:new Date(f.get('date')+'T'+f.get('time')).toISOString()});if(r.error)return alert(r.error.message);closeModal();reminderDate=f.get('date');setTab('reminders')};
}
async function completeReminder(id){const r=await db.from('reminders').update({status:'completed',completed_at:new Date().toISOString()}).eq('id',id);if(r.error)return alert(r.error.message);await loadAll()}
async function cancelReminder(id){if(!confirm('Cancel this reminder?'))return;const r=await db.from('reminders').update({status:'cancelled'}).eq('id',id);if(r.error)return alert(r.error.message);await loadAll()}
window.PCM={setTab,newContact,newReference,toggleRefs:id=>{const el=$(id);if(el)el.classList.toggle('hidden')},editContact:id=>newContact(id),logCall,newReminder,completeReminder,cancelReminder,closeModal,todayReminders:()=>{reminderDate=today();render()}};
start();
})();
</script></body></html>
